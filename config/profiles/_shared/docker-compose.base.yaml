# Centag Deployment Profiles — 公共 Compose 片段
# 被各 Profile 的 docker-compose.yaml 通过 `include` 或复制引用
# 注意：当前各 Profile 独立维护完整 compose 文件以保清晰可见；
# 后续可提取为 include 减少重复。

services:
  centag-base:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    image: centag:latest
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
    volumes:
      - centag_storage:/app/storage
      - centag_logs:/app/logs
      - ./initdata:/app/initdata:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres-base:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-centag}
    volumes:
      - centag_pg:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-centag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-base:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - centag_redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  centag_storage:
  centag_logs:
  centag_pg:
  centag_redis:
