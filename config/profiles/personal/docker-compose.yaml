# Profile: personal — 应用层（默认仅 Centag 单容器 + 线上 API）
# SQLite 内置，无 PG 依赖；OLLAMA_ENABLED=true 时 stack ensure ollama
#
# 持久化（bind-mount → 仓库 var/docker-data/personal，已在 .gitignore）：
#   storage/  → SQLite(centag.db) + system_config 配置 + memory-store
#   logs/     → 应用日志
#   certs/    → MITM/HostProxy CA（对应容器 /app/bin/certs）

name: centag-personal

services:
  centag:
    build:
      context: ../../../
      dockerfile: deploy/docker/Dockerfile.dist
      args:
        DIST_NAME: personal
        INCLUDE_FRONTEND: "true"
    image: centag-personal:latest
    container_name: centag-personal-app
    restart: unless-stopped
    # personal 仅用 SQLite：不注入 deploy/stack/.env（避免 PG 变量污染容器）
    # stack ensure 所需变量由 start.sh load_profile_env 在宿主机侧加载
    env_file:
      - ./.env
      - ../../secrets/.env
    environment:
      # 发行包 personal → 运行时 personal（对话/计量走 SQLite；关闭 team 专属面）
      CENTAG_EDITION: personal
      CENTAG_IN_DOCKER: "1"
      CENTAG_DATA_DIR: /app/storage
      INITDATA_PATH: /app/initdata-profile
      LLM_PROXY_DB_DRIVER: sqlite
      # 必须绝对路径：相对路径会解析到 /app/bin/storage，脱离挂载卷
      SQLITE_PATH: /app/storage/centag.db
      MEMORY_STORE_ROOT: /app/storage/memory-store
      LLM_PROXY_LOG_PATH: /app/logs
      LLM_PROXY_LOG_OUTPUT: both
      LLM_PROXY_LOG_FORMAT: console
      POSTGRES_ENABLED: "false"
      REDIS_ENABLED: "false"
      VECTOR_ENABLED: "false"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://centag-ollama:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://centag-ollama:11434}
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
      # 系统代理 MITM（本机 wrap / PAC）；容器内需监听 0.0.0.0（见 CENTAG_IN_DOCKER）
      - "${LLM_PROXY_SYSTEM_PROXY_PORT:-8081}:8081"
    volumes:
      - ../../../var/docker-data/personal/storage:/app/storage
      - ../../../var/docker-data/personal/logs:/app/logs
      - ../../../var/docker-data/personal/certs:/app/bin/certs
      - ./initdata:/app/initdata-profile:ro
    networks:
      - centag-personal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  centag-personal:
    driver: bridge
