version: "2.0"
description: personal Profile 后端配置 — 默认线上 API，Ollama 按需启用
backends:
  # --- OpenAI（默认启用，在 .env 填入 OPENAI_API_KEY） ---
  - id: openai
    name: OpenAI
    type: openai
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"
    enabled: true
    timeout: 120
    max_retries: 3
    auto_fetch_models: true
    description: OpenAI 官方 API
    supported_models:
      - requested_model: gpt-4o
        actual_model: gpt-4o
        is_exact: true
        compatibility_score: 1.0
      - requested_model: gpt-4o-mini
        actual_model: gpt-4o-mini
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 128000
      features:
        - chat
        - completion
      supports_tools: true
    weight: 100
    priority: 10

  # --- DeepSeek（默认禁用，填 Key 后启用） ---
  - id: deepseek
    name: DeepSeek
    type: openai
    base_url: https://api.deepseek.com
    api_key: "${DEEPSEEK_API_KEY}"
    enabled: false
    timeout: 120
    max_retries: 3
    auto_fetch_models: true
    description: DeepSeek 大模型 API
    supported_models:
      - requested_model: deepseek-v4-flash
        actual_model: deepseek-v4-flash
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 64000
      features:
        - chat
        - completion
      supports_tools: true
    weight: 90
    priority: 10

  # --- Ollama 本地模型（默认禁用，设 OLLAMA_ENABLED=true 后启用） ---
  - id: ollama-local
    name: Ollama (本地)
    type: ollama
    base_url: http://centag-ollama:11434
    api_key: ""
    enabled: false
    timeout: 300
    max_retries: 2
    auto_fetch_models: true
    description: stack Ollama — 需 OLLAMA_ENABLED=true
    supported_models:
      - requested_model: llama3.1
        actual_model: llama3.1
        is_exact: true
        compatibility_score: 1.0
      - requested_model: qwen2.5
        actual_model: qwen2.5
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 128000
      features:
        - chat
        - completion
      supports_tools: false
    weight: 50
    priority: 5