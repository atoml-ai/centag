id: cache-mode
name: Cache Mode
shortcut_code: '#cm'
description: "Default for cached profile: exact + semantic cache to cut API cost"
version: '1.0'
nodes:
- id: cache_read
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Cache Read
  config:
    custom_config:
      embedding_backend_id: ollama-local
      embedding_model: bge-m3
      key_template: '{{model}}:{{hash}}'
      operation: read
      read_storage_name: pg
      semantic_threshold: 0.85
      semantic_top_k: 5
      storage_type: pg
      strategy: hybrid
      vector_storage_name: pg
  timeout: 10
  retry:
    max_attempts: 0
    backoff_strategy: exponential
    initial_delay: 1000
    max_delay: 30000
  next_nodes:
  - generator
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Content Generate
  backend: openai
  model: gpt-4o-mini
  config:
    prompt_template: '{{input}}'
    system_prompt: 请根据用户输入生成合适的回复。
  timeout: 120
  depends_on:
  - cache_read
  next_nodes:
  - cache_write
- id: cache_write
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Cache Write
  config:
    custom_config:
      embedding_backend_id: ollama-local
      embedding_model: bge-m3
      key_template: '{{model}}:{{hash}}'
      operation: write
      read_storage_name: pg
      semantic_threshold: 0.85
      semantic_top_k: 5
      storage_type: pg
      strategy: exact
      ttl: 3600
      vector_storage_name: pg
      write_storage_name: pg
  timeout: 10
  depends_on:
  - generator
global_config:
  timeout: 180
  max_retries: 1
  bypass_on_error: false
  parallel_limit: 2
  log_level: info
metadata:
  aligned_proxy_mode: cache-mode
  profile: cached
  features:
  - cache
  - cache_read
  - cache_write
  lastUpdated: '2026-06-06T00:00:00.000Z'
  layoutVersion: '1.1'
  phase: '5'
  template_scope: mode-id-alignment
