# modular：centag 接入 deploy/stack-network，访问 stack 中间件与 Mem0
services:
  centag:
    networks:
      - centag-agent-memory
      - deploy/stack-network
    environment:
      LLM_PROXY_DB_DRIVER: auto
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: centag-postgresql
      PG_HOST: centag-postgresql
      OLLAMA_HOST: ${OLLAMA_HOST:-http://centag-ollama:11434}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://centag-ollama:11434}
      MEM0_HOST: centag-mem0
      MEM0_PORT: 8000

networks:
  deploy/stack-network:
    external: true