# Profile: agent-memory — 全栈内嵌（legacy / STACK_MODE=embedded）
# 中间件复用 deploy/stack/compose/fragments/（方案 C Phase 2）
# 注意：与 ./start.sh stack start all 默认端口互斥，请勿同机并行启动
# 默认已改为 modular（docker-compose.yaml + stack ensure）；仅 manifest STACK_MODE=embedded 时使用本文件

name: centag-agent-memory

include:
  - path:
      - ../../deploy/stack/compose/fragments/postgresql.yaml
      - ../../deploy/stack/compose/fragments/qdrant.yaml
      - ../../deploy/stack/compose/fragments/ollama.yaml
      - ../../deploy/stack/compose/fragments/mem0.yaml
      - ../../deploy/stack/compose/overrides/profile-agent-memory.yaml

services:
  pi-agent:
    build:
      context: ../../../deploy/stack/services/pi-sandbox/docker
      dockerfile: Dockerfile.pi
      args:
        PI_PACKAGE: ${PI_PACKAGE:-@earendil-works/pi-coding-agent}
        PI_VERSION: ${PI_VERSION:-0.78.1}
    image: centag-pi-agent:latest
    container_name: ${PI_CONTAINER_NAME:-pi-sandbox}
    restart: unless-stopped
    environment:
      - PI_CODING_AGENT_SESSION_DIR=${PI_SESSION_DIR:-/data/sessions}
      - PI_SKIP_VERSION_CHECK=${PI_SKIP_VERSION_CHECK:-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_OAUTH_TOKEN=${ANTHROPIC_OAUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_BASE_URL=${AZURE_OPENAI_BASE_URL:-}
    volumes:
      - ${HOST_WORKSPACE_DIR:-./workspace}:${PI_WORK_DIR:-/workspace}
      - centag_agent_memory_pi_sessions:${PI_SESSION_DIR:-/data/sessions}
      - ../../deploy/stack/services/pi-sandbox/docker/extensions:/extensions:ro
      - ../../deploy/stack/services/pi-sandbox/docker/skills:/skills:ro
      - ../../deploy/stack/services/pi-sandbox/pi-config/models.json:/root/.pi/agent/models.json:ro
      - ../../deploy/stack/services/pi-sandbox/pi-config/settings.json:/root/.pi/agent/settings.json:ro
    deploy:
      resources:
        limits:
          memory: ${PI_MAX_MEMORY:-512m}
          cpus: '${PI_MAX_CPU:-1.0}'
        reservations:
          memory: 256m
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    networks:
      - centag-agent-memory
    healthcheck:
      test: ["CMD", "pi", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pi-client:
    build:
      context: ../../../deploy/stack/services/pi-sandbox/go-client
      dockerfile: Dockerfile
      args:
        PI_PACKAGE: ${PI_PACKAGE:-@earendil-works/pi-coding-agent}
        PI_VERSION: ${PI_VERSION:-0.78.1}
    image: centag-pi-client:latest
    container_name: centag-agent-memory-pi-client
    restart: unless-stopped
    environment:
      - PI_AGENT_HOST=pi-agent
      - PI_AGENT_PORT=80
      - SERVER_PORT=8080
      - GOPROXY=https://goproxy.cn,direct
      - PI_SKIP_VERSION_CHECK=${PI_SKIP_VERSION_CHECK:-1}
    ports:
      - "${GO_CLIENT_PORT:-8080}:8080"
    volumes:
      - ${HOST_WORKSPACE_DIR:-./workspace}:/workspace
    depends_on:
      pi-agent:
        condition: service_healthy
    networks:
      - centag-agent-memory

  centag:
    build:
      context: ../../../
      dockerfile: deploy/docker/Dockerfile
    image: centag:latest
    container_name: centag-agent-memory-app
    restart: unless-stopped
    env_file:
      - ../../deploy/stack/.env
      - ./.env
      - ../../secrets/.env
    environment:
      INITDATA_PATH: /app/initdata-profile
      LLM_PROXY_DB_DRIVER: auto
      POSTGRES_HOST: postgresql
      PG_HOST: postgresql
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      MEM0_HOST: mem0
      MEM0_PORT: 8000
      PI_SANDBOX_HOST: pi-client
      PI_SANDBOX_PORT: 8080
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
    volumes:
      - centag_agent_memory_storage:/app/storage
      - centag_agent_memory_logs:/app/logs
      - ./initdata:/app/initdata-profile:ro
    networks:
      - centag-agent-memory
    depends_on:
      postgresql:
        condition: service_healthy
      mem0:
        condition: service_started
      pi-client:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  centag_agent_memory_pi_sessions:
  centag_agent_memory_storage:
  centag_agent_memory_logs: