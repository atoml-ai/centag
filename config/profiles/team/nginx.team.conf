upstream centag_team {
    server centag:20060;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Liveness — any replica healthy enough for LB process
    location = /health {
        proxy_pass http://centag_team/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Readiness — verify DB via any backend instance
    location = /health/ready {
        proxy_pass http://centag_team/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://centag_team;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}