# 水平扩展 overlay：Nginx 负载均衡 + 多副本 Centag
#
# 用法（在 config/profiles/team 目录）：
#   docker compose -f docker-compose.yaml \
#     -f docker-compose.stack-network.yaml \
#     -f docker-compose.ha.yaml up -d --scale centag=2
#
# 或：CENTAG_REPLICAS=3 ./start.sh profile team up  （若 start.sh 透传 scale 参数）

services:
  centag-lb:
    image: nginx:1.27-alpine
    container_name: centag-team-lb
    restart: unless-stopped
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:80"
    volumes:
      - ./nginx.team.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      centag:
        condition: service_healthy
    networks:
      - centag-team
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  centag:
    ports: !reset []