# Profile: team — 服务集群版（PostgreSQL + Redis + Qdrant + CENTAG_EDITION=team）
# 一键部署所有中间件和 Centag 服务
# 用法: ./start.sh dist docker-run team

name: centag-team

services:
  # ============================================================
  # Centag 主服务
  # ============================================================
  centag:
    build:
      context: ../../../
      dockerfile: deploy/docker/Dockerfile.dist
      args:
        DIST_NAME: team
        INCLUDE_FRONTEND: "true"
    image: centag-team:latest
    container_name: centag-team-app
    restart: unless-stopped
    env_file:
      - ./.env
      - ../../secrets/.env
    environment:
      INITDATA_PATH: /app/initdata-profile
      CENTAG_EDITION: team
      LLM_PROXY_DB_DRIVER: postgresql
      POSTGRES_ENABLED: "true"
      POSTGRES_HOST: postgresql
      PG_HOST: postgresql
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PG_DATABASE: ${POSTGRES_DB:-centag}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      VECTOR_ENABLED: "true"
      VECTOR_TYPE: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      VECTOR_ADDR: qdrant:6333
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
    volumes:
      - centag_team_storage:/app/storage
      - centag_team_logs:/app/logs
      - ./initdata:/app/initdata-profile:ro
    networks:
      - centag-team
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================
  # PostgreSQL (pgvector)
  # ============================================================
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: centag-team-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-centag}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - centag_team_postgresql:/var/lib/postgresql/data
    networks:
      - centag-team
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-centag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: centag-team-redis
    restart: unless-stopped
    command: >
      sh -c '
      if [ -n "$${REDIS_PASSWORD:-}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      else
        redis-server --appendonly yes
      fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - centag_team_redis:/data
    networks:
      - centag-team
    healthcheck:
      test: >
        sh -c '
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping
        else
          redis-cli ping
        fi
        '
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # Qdrant 向量数据库
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: centag-team-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - centag_team_qdrant:/qdrant/storage
    networks:
      - centag-team
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  centag_team_storage:
  centag_team_logs:
  centag_team_postgresql:
  centag_team_redis:
  centag_team_qdrant:

networks:
  centag-team:
    driver: bridge
