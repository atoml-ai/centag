# Profile: minimal — 轻量单机 / 代理服务
# 文件配置（无 DB 驱动）；无 PG / 前端；DIST_NAME=minimal

name: centag-minimal

services:
  centag:
    build:
      context: ../../../
      dockerfile: deploy/docker/Dockerfile.dist
      args:
        DIST_NAME: minimal
        INCLUDE_FRONTEND: "false"
    image: centag-minimal:latest
    container_name: centag-minimal-app
    restart: unless-stopped
    env_file:
      - ./.env
      - ../../secrets/.env
    environment:
      INITDATA_PATH: /app/initdata-profile
      # minimal 发行版走文件配置入口；下列驱动变量保留兼容，实际不启 DB 插件
      LLM_PROXY_DB_DRIVER: sqlite
      SQLITE_PATH: /app/storage/centag.db
      LLM_PROXY_LOG_PATH: /app/logs
      LLM_PROXY_LOG_OUTPUT: both
      LLM_PROXY_LOG_FORMAT: console
      POSTGRES_ENABLED: "false"
      REDIS_ENABLED: "false"
      VECTOR_ENABLED: "false"
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
    volumes:
      - centag_minimal_storage:/app/storage
      - centag_minimal_logs:/app/logs
      - ./initdata:/app/initdata-profile:ro
    networks:
      - centag-minimal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  centag_minimal_storage:
  centag_minimal_logs:

networks:
  centag-minimal:
    driver: bridge
