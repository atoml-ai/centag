# Profile: minimal — 轻量单机 / 代理服务
# 文件配置（无 DB 驱动）；无 PG / 前端；DIST_NAME=minimal
#
# 持久化（bind-mount → 仓库 var/docker-data/minimal）：
#   storage/  → SQLite（若启用）+ CENTAG_DATA_DIR 下 proxy-config.yaml 等
#   logs/     → 应用日志
#   certs/    → MITM CA

name: centag-minimal

services:
  centag:
    build:
      context: ../../../
      dockerfile: deploy/docker/Dockerfile.dist
      args:
        DIST_NAME: minimal
        INCLUDE_FRONTEND: "false"
    image: centag-minimal:latest
    container_name: centag-minimal-app
    restart: unless-stopped
    env_file:
      - ./.env
      - ../../secrets/.env
    environment:
      CENTAG_IN_DOCKER: "1"
      CENTAG_DATA_DIR: /app/storage
      INITDATA_PATH: /app/initdata-profile
      # minimal 发行版走文件配置入口；下列驱动变量保留兼容，实际不启 DB 插件
      LLM_PROXY_DB_DRIVER: sqlite
      SQLITE_PATH: /app/storage/centag.db
      MEMORY_STORE_ROOT: /app/storage/memory-store
      LLM_PROXY_LOG_PATH: /app/logs
      LLM_PROXY_LOG_OUTPUT: both
      LLM_PROXY_LOG_FORMAT: console
      POSTGRES_ENABLED: "false"
      REDIS_ENABLED: "false"
      VECTOR_ENABLED: "false"
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
      - "${LLM_PROXY_SYSTEM_PROXY_PORT:-8081}:8081"
    volumes:
      - ../../../var/docker-data/minimal/storage:/app/storage
      - ../../../var/docker-data/minimal/logs:/app/logs
      - ../../../var/docker-data/minimal/certs:/app/bin/certs
      - ./initdata:/app/initdata-profile:ro
    networks:
      - centag-minimal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  centag-minimal:
    driver: bridge
