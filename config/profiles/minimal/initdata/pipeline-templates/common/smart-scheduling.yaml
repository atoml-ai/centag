version: '1.0'
nodes:
- id: scheduler
  type: scheduler
  kind: scheduling.decide
  implementation: builtin.scheduler
  name: Smart Scheduling
  timeout: 15
  config:
    custom_config:
      strategy: balance
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Scheduled Generate
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    template_vars:
      backend: "system.default_backend"
      model: "system.default_model"
  timeout: 120
  depends_on:
  - scheduler
schema_version: centag.pipeline/v1alpha1
id: smart-scheduling
name: Smart Scheduling
shortcut_code: '#s'
global_config:
  timeout: 180
  max_retries: 2
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
description: "Smart scheduling (strategy unchanged): builtin.scheduler classifies intent and scores backends/models, then generates; contrasts with transparent mode (follow client model) and direct mode (inject prompt + fixed backend/model)"
metadata:
  aligned_proxy_mode: smart-scheduling
  lastUpdated: '2026-07-21T00:00:00.000Z'
  layoutVersion: '1.2'
