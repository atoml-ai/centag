id: fixed-egress
name: Fixed Egress (Hop)
description: |
  Centag as a fixed egress hop: no cross-backend model matching; always use the system default backend/model (or explicit X-Backend-ID).
  Server rewrites auth with the backend API key before forwarding. Shares transparent_forward with direct/transparent; difference is switches:
  route_policy=fixed + inject_system_prompt=false.
version: "1.0"
shortcut_code: '#j'
nodes:
  - id: forward
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: Fixed Egress Forward
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    config:
      backend: "{{system.default_backend}}"
      model: "{{system.default_model}}"
      template_vars:
        backend: "system.default_backend"
        model: "system.default_model"
      custom_config:
        default_scheme: https
        route_policy: fixed
        inject_system_prompt: false
        redirect_policy: never
        max_redirects: 5
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
global_config:
  timeout: 120
  max_retries: 0
  bypass_on_error: false
  parallel_limit: 1
  log_level: info
metadata:
  aligned_proxy_mode: fixed-egress
  features:
    - transparent_forward
    - fixed_egress
    - key_rewrite
    - no_model_match
  lastUpdated: '2026-07-23T00:00:00.000Z'
  layoutVersion: '1.2'
  template_scope: mode-id-alignment
