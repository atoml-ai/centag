version: "2.0"
description: Centag 初始后端配置 - 主流 LLM 算力提供商
backends:
  - id: openai
    name: OpenAI
    type: openai
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"
    enabled: false
    timeout: 120
    max_retries: 3
    auto_fetch_models: true
    description: OpenAI GPT-4/GPT-3.5 官方 API - https://platform.openai.com
    supported_models:
      - requested_model: gpt-4
        actual_model: gpt-4
        is_exact: true
        compatibility_score: 1.0
      - requested_model: gpt-4-turbo
        actual_model: gpt-4-turbo-preview
        is_exact: true
        compatibility_score: 1.0
      - requested_model: gpt-4o
        actual_model: gpt-4o
        is_exact: true
        compatibility_score: 1.0
      - requested_model: gpt-4o-mini
        actual_model: gpt-4o-mini
        is_exact: true
        compatibility_score: 1.0
      - requested_model: gpt-3.5-turbo
        actual_model: gpt-3.5-turbo
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 128000
      features:
        - chat
        - completion
        - embeddings
      supports_tools: true
    weight: 100
    priority: 10

  - id: anthropic
    name: Anthropic Claude
    type: anthropic
    base_url: https://api.anthropic.com/v1
    api_key: "${ANTHROPIC_API_KEY}"
    enabled: false
    timeout: 120
    max_retries: 3
    auto_fetch_models: true
    description: Anthropic Claude 官方 API - https://console.anthropic.com
    supported_models:
      - requested_model: claude-3-opus
        actual_model: claude-3-opus-20240229
        is_exact: true
        compatibility_score: 1.0
      - requested_model: claude-3-sonnet
        actual_model: claude-3-sonnet-20240229
        is_exact: true
        compatibility_score: 1.0
      - requested_model: claude-3-haiku
        actual_model: claude-3-haiku-20240307
        is_exact: true
        compatibility_score: 1.0
      - requested_model: claude-3-5-sonnet
        actual_model: claude-3-5-sonnet-20241022
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 8000
      features:
        - chat
        - completion
      supports_tools: true
    weight: 100
    priority: 10

  - id: ollama-local
    name: Ollama (本地)
    type: ollama
    base_url: http://localhost:21434
    api_key: "${OLLAMA_LOCAL_API_KEY}"
    enabled: true
    timeout: 300
    max_retries: 2
    auto_fetch_models: true
    description: 本地 Ollama 服务 - 无需 API Key，自动拉取模型列表
    supported_models:
      - requested_model: llama3
        actual_model: llama3
        is_exact: true
        compatibility_score: 1.0
      - requested_model: llama3.1
        actual_model: llama3.1
        is_exact: true
        compatibility_score: 1.0
      - requested_model: qwen2.5
        actual_model: qwen2.5
        is_exact: true
        compatibility_score: 1.0
      - requested_model: bge-m3:latest
        actual_model: bge-m3:latest
        is_exact: true
        compatibility_score: 1.0
    capabilities:
      max_context_tokens: 128000
      features:
        - chat
        - completion
      supports_tools: false
    weight: 50
    priority: 5

