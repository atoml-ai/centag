id: transparent-proxy
name: 透明模式
description: 标准客户端可用：直连已配置后端，不注入网关 system prompt，原样保留客户端 messages（缓存请用 cache-mode）
version: "2.0"
shortcut_code: '#t'
nodes:
  - id: generate
    type: generator
    kind: llm.generate
    implementation: builtin.generator
    name: 透传生成
    backend: bigmodel
    model: GLM-4-flash
    config:
      backend: bigmodel
      model: GLM-4-flash
      prompt_template: '{{input}}'
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
global_config:
  timeout: 120
  max_retries: 3
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
metadata:
  aligned_proxy_mode: transparent-proxy
  features:
    - no_system_prompt_inject
  lastUpdated: '2026-07-14T00:00:00.000Z'
  layoutVersion: '1.1'
  template_scope: mode-id-alignment
