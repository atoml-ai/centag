version: '1.0'
schema_version: centag.pipeline/v1alpha1
id: transparent-proxy-redis-cache
name: Cache + Fixed-Egress Example (Redis)
description: "Example: cache + transparent_forward; user transparent mode now uses a generator without system prompt — use cache-mode for caching and fixed-egress for fixed outbound hop"
metadata:
  aligned_proxy_mode: fixed-egress
  lastUpdated: '2026-07-14T00:00:00.000Z'
  layoutVersion: '1.2'
  template_scope: example
  phase: '4'
  features:
  - cache
  - token_usage
  storage: redis

nodes:
# 注意：cache 节点实际读写走全局「存储管理」的默认 KV 存储（storage.default_kv）
# 与 cache.backend=exact；下方 config.host/port 仅供展示，不参与连接。
- id: cache_read
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Redis Cache Read
  config:
    custom_config:
      operation: read
      strategy: exact
      storage_type: redis
      key_template: centag:cache:{{model}}:{{hash}}
      config:
        host: localhost
        port: 6379
        db: 0
        password: ''
        key_prefix: 'centag:cache:'
  timeout: 10
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Transparent Proxy Generate
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    template_vars:
      backend: "system.default_backend"
      model: "system.default_model"
    system_prompt: Redis 缓存后端示例
  timeout: 120
  condition: '{{cache_read.metadata.cache_hit}} != true'
  depends_on:
  - cache_read
- id: cache_write
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Redis Cache Write
  config:
    custom_config:
      operation: write
      strategy: exact
      storage_type: redis
      ttl: 7200
      key_template: centag:cache:{{model}}:{{hash}}
      config:
        host: localhost
        port: 6379
        db: 0
        key_prefix: 'centag:cache:'
  timeout: 10
  depends_on:
  - generator
- id: token_usage_record
  type: token_usage
  kind: metrics.token_usage
  implementation: builtin.token_usage
  name: Token Metering
  # 计量持久化走全局计费钩子（team 版落 Postgres token_usage 表）；
  # 节点级 storage_type/database_path 为无效配置（executeRecord 不读取），故不配置。
  config:
    custom_config:
      operation: record
      record_fields:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - model
      - backend_id
      - user_id
  timeout: 5
  depends_on:
  - generator
global_config:
  timeout: 120
  max_retries: 1
  bypass_on_error: false
  parallel_limit: 1
  log_level: info
