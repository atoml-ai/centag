version: '1.0'
schema_version: centag.pipeline/v1alpha1
id: cache-hit
name: Cache-First Mode
shortcut_code: '#ch'
description: "Read cache first; return on hit, otherwise generate with the model and write back to cache"
metadata:
  aligned_proxy_mode: cache-hit
  lastUpdated: '2026-05-19T15:25:00.000Z'
  layoutVersion: '2.0'
  template_scope: mode-id-alignment
  phase: '5'
  features:
  - cache
  - cache-first
  - fallback_to_generate
nodes:
- id: cache_read
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Cache Read
  description: Try reading a response from cache; on hit set cache_hit=true
  config:
    custom_config:
      operation: read
      strategy: exact
      storage_type: pg
      read_storage_name: pg
      key_template: '{{model}}:{{hash}}'
      vector_storage_name: pg
      embedding_model: text-embedding-3-small
      semantic_threshold: 0.85
      semantic_top_k: 5
  timeout: 5
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Content Generate
  description: Generate content when cache misses
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    template_vars:
      backend: "system.default_backend"
      model: "system.default_model"
    system_prompt: 请根据用户输入生成合适的回复。
  timeout: 120
  condition: '{{.cache_read.metadata.cache_hit}} == false'
  depends_on:
  - cache_read
- id: cache_write
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: Cache Write
  description: Write generated content to cache on miss
  config:
    custom_config:
      operation: write
      strategy: exact
      storage_type: pg
      write_storage_name: pg
      ttl: 3600
      key_template: '{{model}}:{{hash}}'
      enable_evaluation: false
      eval_threshold: 70.0
      enable_qa_split: false
      vector_storage_name: pg
      embedding_model: text-embedding-3-small
      semantic_threshold: 0.85
      semantic_top_k: 5
  timeout: 5
  condition: '{{.cache_read.metadata.cache_hit}} == false'
  depends_on:
  - generator
global_config:
  timeout: 180
  max_retries: 1
  bypass_on_error: true
  parallel_limit: 1
  log_level: info
inputs:
  content:
    description: User input
    required: true
    type: string
  model:
    description: Target model
    required: false
    type: string
    default: ''
  cache_strategy:
    description: "Cache strategy: KV / semantic / hybrid"
    required: false
    type: string
    default: exact
    enum:
    - exact
    - semantic
    - hybrid
  vector_storage:
    description: Vector store name (for semantic/hybrid)
    required: false
    type: string
    default: pg
  embedding_model:
    description: Embedding model for vectors
    required: false
    type: string
    default: text-embedding-3-small
outputs:
  content:
    description: "Response content (cached on hit, generated on miss; engine picks the last executed node output)"
  cache_hit:
    description: Whether cache was hit
    source: cache_read.metadata.cache_hit
  cache_saved:
    description: Whether cache write succeeded
    source: cache_write.metadata.write_success
