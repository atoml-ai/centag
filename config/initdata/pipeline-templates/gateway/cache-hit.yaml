version: '1.0'
schema_version: centag.pipeline/v1alpha1
id: cache-hit
name: 缓存优先模式
shortcut_code: '#ch'
description: 先读取缓存，命中则直接返回，未命中则调用大模型生成并写入缓存
metadata:
  aligned_proxy_mode: cache-hit
  lastUpdated: '2026-05-19T15:25:00.000Z'
  layoutVersion: '2.0'
  template_scope: mode-id-alignment
  phase: '5'
  features:
  - cache
  - cache优先
  - fallback_to_generate
nodes:
- id: cache_read
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: 缓存读取
  description: 尝试从缓存读取响应，命中则设置 cache_hit=true
  config:
    custom_config:
      operation: read
      strategy: exact
      storage_type: pg
      read_storage_name: pg
      key_template: '{{model}}:{{hash}}'
      vector_storage_name: pg
      embedding_model: text-embedding-3-small
      semantic_threshold: 0.85
      semantic_top_k: 5
  timeout: 5
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 内容生成
  description: 当缓存未命中时生成内容
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    template_vars:
      backend: "system.default_backend"
      model: "system.default_model"
    system_prompt: 请根据用户输入生成合适的回复。
  timeout: 120
  condition: '{{.cache_read.metadata.cache_hit}} == false'
  depends_on:
  - cache_read
- id: cache_write
  type: cache
  kind: cache.access
  implementation: builtin.cache
  name: 缓存写入
  description: 当缓存未命中时，将生成的内容写入缓存
  config:
    custom_config:
      operation: write
      strategy: exact
      storage_type: pg
      write_storage_name: pg
      ttl: 3600
      key_template: '{{model}}:{{hash}}'
      enable_evaluation: false
      eval_threshold: 70.0
      enable_qa_split: false
      vector_storage_name: pg
      embedding_model: text-embedding-3-small
      semantic_threshold: 0.85
      semantic_top_k: 5
  timeout: 5
  condition: '{{.cache_read.metadata.cache_hit}} == false'
  depends_on:
  - generator
global_config:
  timeout: 180
  max_retries: 1
  bypass_on_error: true
  parallel_limit: 1
  log_level: info
inputs:
  content:
    description: 用户输入内容
    required: true
    type: string
  model:
    description: 目标模型
    required: false
    type: string
    default: ''
  cache_strategy:
    description: 缓存策略，支持KV/语义/混合
    required: false
    type: string
    default: exact
    enum:
    - exact
    - semantic
    - hybrid
  vector_storage:
    description: 向量存储名称（语义/混合策略时使用）
    required: false
    type: string
    default: pg
  embedding_model:
    description: 向量生成使用的embedding模型
    required: false
    type: string
    default: text-embedding-3-small
outputs:
  content:
    description: 响应内容（缓存命中时为缓存内容，未命中时为生成内容。由引擎自动选择最后一个执行节点的输出）
  cache_hit:
    description: 是否命中缓存
    source: cache_read.metadata.cache_hit
  cache_saved:
    description: 是否成功保存到缓存
    source: cache_write.metadata.write_success
