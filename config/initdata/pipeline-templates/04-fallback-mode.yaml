id: fallback-mode
name: 降级模式
shortcut_code: '#f'
description: |
  主后端失败后自动降级到备用后端（FallbackGroup 机制）。
  与调度器熔断联动：某 backend 熔断打开时，引擎会跳过该节点的执行并尝试下一备用节点；
  熔断状态变化会写入服务日志（[CircuitBreaker]）。
version: '1.0'
nodes:
- id: primary
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 主后端生成
  backend: bigmodel
  model: GLM-4.7-Flash
  config:
    prompt_template: '{{input}}'
  timeout: 90
  retry:
    max_attempts: 2
    backoff_strategy: exponential
    initial_delay: 1000
    max_delay: 8000
  next_nodes:
  - fallback
- id: fallback
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 降级后端生成
  backend: bigmodel
  model: GLM-4-flash
  config:
    prompt_template: '{{input}}'
    custom_config:
      is_fallback: true
  timeout: 60
  retry:
    max_attempts: 0
    backoff_strategy: exponential
    initial_delay: 1000
    max_delay: 30000
  depends_on:
  - primary
global_config:
  timeout: 180
  max_retries: 2
  bypass_on_error: true
  parallel_limit: 1
  log_level: info
  fallback_groups:
  - primary_node_id: primary
    fallback_nodes:
    - fallback
    max_attempts: 2
metadata:
  lastUpdated: '2026-05-18T08:40:41.591Z'
  layoutVersion: '1.1'
  mode: fallback-mode
  shortcut: '#f'
  version: '2.0'
