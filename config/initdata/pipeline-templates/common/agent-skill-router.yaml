    route_value: log-analysis-gen
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |-
      你是一个 centag 运维助手，正在执行 skill: log-analysis

      日志分析

      你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
      - read_config：读取 centag 配置文件
      - read_log：读取 centag 日志文件（无 path 时自动列出日志位置）
      - read_database：查询 centag 数据库（只读）
      - write_config：写入配置文件（需要用户确认）
      - analyze：分析数据并生成报告
      - system_info：获取当前操作系统/主机信息（只读）
      - centag_info：获取 centag 数据目录/日志路径/数据库位置/配置说明

      提示：分析日志、配置或数据库前，先调用 centag_info 或 read_log/read_config（不带 path）确认文件位置，不要臆测路径。

      执行规则（非常重要）：
      1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
      2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。

      请按照以下步骤执行：
      1. 使用read_log工具读取日志文件
      2. 使用analyze工具分析日志
      3. 输出分析报告
    template_vars:
      backend: system.default_backend
      model: system.default_model
- id: strategy-recommend-gen
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: strategy-recommend
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - skill-classifier
  route_config:
    router_node_id: skill-classifier
    route_value: strategy-recommend-gen
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |-
      你是一个 centag 运维助手，正在执行 skill: strategy-recommend

      策略调整建议

      你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
      - read_config：读取 centag 配置文件
      - read_log：读取 centag 日志文件（无 path 时自动列出日志位置）
      - read_database：查询 centag 数据库（只读）
      - write_config：写入配置文件（需要用户确认）
      - analyze：分析数据并生成报告
      - system_info：获取当前操作系统/主机信息（只读）
      - centag_info：获取 centag 数据目录/日志路径/数据库位置/配置说明

      提示：分析日志、配置或数据库前，先调用 centag_info 或 read_log/read_config（不带 path）确认文件位置，不要臆测路径。

      执行规则（非常重要）：
      1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
      2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。

      请按照以下步骤执行：
      1. 使用read_config工具读取当前配置
      2. 使用read_database工具查询运行时数据
      3. 使用analyze工具分析策略效果
      4. 输出优化建议报告
    template_vars:
      backend: system.default_backend
      model: system.default_model
- id: chat-gen
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: General Chat
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - skill-classifier
  route_config:
    router_node_id: skill-classifier
    route_value: chat-gen
    is_default: true
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |-
      你是一个可靠助手，请直接、准确地回答用户的问题。
    template_vars:
      backend: system.default_backend
      model: system.default_model
global_config:
  timeout: 180
  max_retries: 3
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
metadata:
  agent_skill_pipeline: true
  skill_router: true
