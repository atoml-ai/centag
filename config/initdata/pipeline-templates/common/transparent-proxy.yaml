id: transparent-proxy
name: 透明模式
description: 尽可能原样透传客户端请求（不注入 system prompt）；若请求指定了 model，则跨已启用后端按模型名松匹配（如 mino2.5 ≈ mino2.5 free）并优先走该后端；未指定或未命中时回落系统默认后端与模型
version: "2.1"
shortcut_code: '#t'
nodes:
  - id: forward
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: 透明转发
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    config:
      backend: "{{system.default_backend}}"
      model: "{{system.default_model}}"
      template_vars:
        backend: "system.default_backend"
        model: "system.default_model"
      custom_config:
        default_scheme: https
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
global_config:
  timeout: 120
  max_retries: 3
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
metadata:
  aligned_proxy_mode: transparent-proxy
  features:
    - no_system_prompt_inject
    - raw_passthrough
    - transparent_forward
    - client_model_prefer
    - loose_model_match
  lastUpdated: '2026-07-21T00:00:00.000Z'
  layoutVersion: '1.2'
  template_scope: mode-id-alignment
