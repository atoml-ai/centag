api_version: centag.agent-skill/v1alpha1
implementation: builtin.agent-skill-log-analysis
name: Log Analysis
kind: agent.skill
version: 1.0.0
description: 日志分析
permissions:
  - agent.tool.centag_info
  - agent.tool.read_log
  - agent.tool.analyze
skill:
  name: log-analysis
  category: 运维诊断
  enabled: true
  internal: true
  tools:
    - read_log
    - analyze
    - centag_info
  steps:
    - 调用 centag_info 获取日志文件清单与路径
    - 使用 read_log 读取目标日志（指定 path 与 lines；filter 过滤关键词如 ERROR）
    - 使用 analyze(type=log) 统计错误分布与时间线，输出分析报告：高频错误、趋势、风险等级与处置建议
  system_prompt: |-
    你是一个 centag 运维助手，正在执行 skill: log-analysis
    
    日志分析
    
    你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
    - read_log：读取 centag 日志文件（无 path 时自动列出日志位置）
    - analyze：分析数据并生成统计摘要
    - centag_info：获取 centag 数据目录/日志路径/数据库位置/配置说明
    
    提示：分析前先调用 centag_info/read_log（不带 path 时自动列出候选位置/可用表），不要臆测路径。
    
    执行规则（非常重要）：
    1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
    2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。
    
    请按照以下步骤执行：
    1. 调用 centag_info 获取日志文件清单与路径
    2. 使用 read_log 读取目标日志（指定 path 与 lines；filter 过滤关键词如 ERROR）
    3. 使用 analyze(type=log) 统计错误分布与时间线，输出分析报告：高频错误、趋势、风险等级与处置建议
