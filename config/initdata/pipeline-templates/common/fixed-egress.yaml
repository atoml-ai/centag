id: fixed-egress
name: 跳板模式（固定出站）
description: |
  Centag 作为固定出站跳板：不做跨后端模型匹配，固定走系统默认后端/模型（或显式 X-Backend-ID），
  服务端用后端 API Key 改写鉴权后转发。与直连/透明共用 transparent_forward，差异在开关：
  route_policy=fixed + inject_system_prompt=false。
version: "1.0"
shortcut_code: '#j'
nodes:
  - id: forward
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: 固定出站转发
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    config:
      backend: "{{system.default_backend}}"
      model: "{{system.default_model}}"
      template_vars:
        backend: "system.default_backend"
        model: "system.default_model"
      custom_config:
        default_scheme: https
        route_policy: fixed
        inject_system_prompt: false
        redirect_policy: never
        max_redirects: 5
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
global_config:
  timeout: 120
  max_retries: 0
  bypass_on_error: false
  parallel_limit: 1
  log_level: info
metadata:
  aligned_proxy_mode: fixed-egress
  features:
    - transparent_forward
    - fixed_egress
    - key_rewrite
    - no_model_match
  lastUpdated: '2026-07-23T00:00:00.000Z'
  layoutVersion: '1.2'
  template_scope: mode-id-alignment
