api_version: centag.agent-skill/v1alpha1
implementation: builtin.agent-skill-status-check
name: Status Check
kind: agent.skill
version: 1.0.0
description: 查询centag当前运行状态
permissions:
  - agent.tool.read_config
  - agent.tool.read_database
  - agent.tool.analyze
skill:
  name: status-check
  category: 运维诊断
  enabled: true
  internal: true
  tools:
    - read_config
    - read_database
    - analyze
  steps:
    - 使用read_config工具读取配置文件
    - 使用read_database工具查询运行时状态
    - 使用analyze工具分析状态
    - 输出状态报告
  system_prompt: |-
    你是一个 centag 运维助手，正在执行 skill: status-check
    
    查询centag当前运行状态
    
    你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
    - read_config：读取 centag 配置文件
    - read_database：查询 centag 数据库（只读，仅限白名单表）
    - analyze：分析数据并生成统计摘要
    
    提示：分析前先调用 read_config（不带 path 时自动列出候选位置/可用表），不要臆测路径。
    
    执行规则（非常重要）：
    1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
    2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。
    
    请按照以下步骤执行：
    1. 使用read_config工具读取配置文件
    2. 使用read_database工具查询运行时状态
    3. 使用analyze工具分析状态
    4. 输出状态报告
