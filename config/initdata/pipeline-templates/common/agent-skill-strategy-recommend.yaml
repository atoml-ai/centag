api_version: centag.agent-skill/v1alpha1
implementation: builtin.agent-skill-strategy-recommend
name: Strategy Recommend
kind: agent.skill
version: 1.0.0
description: 策略调整建议
permissions:
  - agent.tool.read_config
  - agent.tool.centag_info
  - agent.tool.read_database
  - agent.tool.analyze
skill:
  name: strategy-recommend
  category: 策略优化
  enabled: true
  internal: true
  tools:
    - read_config
    - centag_info
    - read_database
    - analyze
  steps:
    - 调用 centag_info 获取系统概览与可用数据表清单
    - 使用 read_config 读取当前基线配置：centag.conf 与 proxy-config.yaml
    - 使用 read_database 查询 user_request_logs(请求量)、token_usage(用量)、pricing_rules(计费规则)，分析流量与成本结构
    - 使用 analyze(type=strategy) 评估策略效果，输出优化建议：路由策略、成本控制、容量规划与预期收益
  system_prompt: |-
    你是一个 centag 运维助手，正在执行 skill: strategy-recommend
    
    策略调整建议
    
    你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
    - read_config：读取 centag 配置文件
    - centag_info：获取 centag 数据目录/日志路径/数据库位置/配置说明
    - read_database：查询 centag 数据库（只读，仅限白名单表）
    - analyze：分析数据并生成统计摘要
    
    提示：分析前先调用 centag_info/read_config（不带 path 时自动列出候选位置/可用表），不要臆测路径。
    
    执行规则（非常重要）：
    1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
    2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。
    
    请按照以下步骤执行：
    1. 调用 centag_info 获取系统概览与可用数据表清单
    2. 使用 read_config 读取当前基线配置：centag.conf 与 proxy-config.yaml
    3. 使用 read_database 查询 user_request_logs(请求量)、token_usage(用量)、pricing_rules(计费规则)，分析流量与成本结构
    4. 使用 analyze(type=strategy) 评估策略效果，输出优化建议：路由策略、成本控制、容量规划与预期收益
