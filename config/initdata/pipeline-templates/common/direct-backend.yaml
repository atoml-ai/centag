id: direct-backend
name: 直连后端
description: |
  固定出站到系统默认（或钉死）后端，并注入网关 system prompt 替换客户端 system。
  与透明/跳板共用 transparent_forward 出站节点，差异仅在开关：route_policy=fixed + inject_system_prompt=true。
version: "3.0"
shortcut_code: '#d'
nodes:
  - id: forward
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: 直连出站
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    config:
      backend: "{{system.default_backend}}"
      model: "{{system.default_model}}"
      system_prompt: |
        你是一个可靠助手，请直接、准确地回答用户的问题。

        ## 行为准则
        - 回答简洁，直击问题核心
        - 问题有歧义时先确认意图
        - 不确定时诚实说明，不编造

        ## 风格
        - 优先结构化表达（分段、列表）
        - 技术问题给出可执行示例
      template_vars:
        backend: "system.default_backend"
        model: "system.default_model"
      custom_config:
        default_scheme: https
        route_policy: fixed
        inject_system_prompt: true
        redirect_policy: never
        max_redirects: 5
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
global_config:
  timeout: 120
  max_retries: 3
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
metadata:
  aligned_proxy_mode: direct-backend
  features:
    - transparent_forward
    - fixed_egress
    - system_prompt_inject
    - key_rewrite
  lastUpdated: '2026-07-23T00:00:00.000Z'
  layoutVersion: '1.3'
  template_scope: mode-id-alignment
