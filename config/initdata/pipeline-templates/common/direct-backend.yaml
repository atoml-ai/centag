id: direct-backend
name: Direct Backend
description: |
  Fixed egress to the system default (or pinned) backend, injecting a gateway system prompt that replaces the client system message.
  On insufficient balance/quota: try fallback_model on the node first, then FallbackGroup.
  Shares transparent_forward with transparent/hop modes; difference is switches: route_policy=fixed + inject_system_prompt=true.
version: "3.1"
shortcut_code: '#d'
nodes:
  - id: forward
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: Direct Egress
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    config:
      backend: "{{system.default_backend}}"
      model: "{{system.default_model}}"
      system_prompt: |
        你是一个可靠助手，请直接、准确地回答用户的问题。

        ## 行为准则
        - 回答简洁，直击问题核心
        - 问题有歧义时先确认意图
        - 不确定时诚实说明，不编造

        ## 风格
        - 优先结构化表达（分段、列表）
        - 技术问题给出可执行示例
      template_vars:
        backend: "system.default_backend"
        model: "system.default_model"
      custom_config:
        default_scheme: https
        route_policy: fixed
        inject_system_prompt: true
        redirect_policy: never
        max_redirects: 5
    timeout: 120
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
    next_nodes:
      - forward_fallback
  - id: forward_fallback
    type: transparent_forward
    kind: proxy.transparent_forward
    implementation: builtin.transparent_forward
    name: Direct Fallback Egress
    backend: "{{system.fallback_backend}}"
    model: "{{system.fallback_model}}"
    config:
      backend: "{{system.fallback_backend}}"
      model: "{{system.fallback_model}}"
      system_prompt: |
        你是一个可靠助手，请直接、准确地回答用户的问题。

        ## 行为准则
        - 回答简洁，直击问题核心
        - 问题有歧义时先确认意图
        - 不确定时诚实说明，不编造

        ## 风格
        - 优先结构化表达（分段、列表）
        - 技术问题给出可执行示例
      template_vars:
        backend: "system.fallback_backend"
        model: "system.fallback_model"
      custom_config:
        default_scheme: https
        route_policy: fixed
        inject_system_prompt: true
        redirect_policy: never
        max_redirects: 5
        is_fallback: true
    timeout: 90
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      initial_delay: 1000
      max_delay: 30000
    depends_on:
      - forward
global_config:
  timeout: 180
  max_retries: 3
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
  fallback_groups:
    - primary_node_id: forward
      fallback_nodes:
        - forward_fallback
      max_attempts: 2
metadata:
  aligned_proxy_mode: direct-backend
  features:
    - transparent_forward
    - fixed_egress
    - system_prompt_inject
    - key_rewrite
    - billing_fallback
  lastUpdated: '2026-07-23T00:00:00.000Z'
  layoutVersion: '1.4'
  template_scope: mode-id-alignment
