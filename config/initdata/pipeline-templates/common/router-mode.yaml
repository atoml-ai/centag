version: '1.0'
schema_version: centag.pipeline/v1alpha1
id: router-mode
name: 路由模式
shortcut_code: '#r'
description: 按关键词/意图将请求分发到代码、翻译、摘要或通用对话分支（builtin.router）
nodes:
- id: classifier
  type: router
  kind: routing.decide
  implementation: builtin.router
  name: 路由分类
  timeout: 15
  config:
    custom_config:
      routing_strategy: keyword_contains
      default_route: chat-generator
      routes:
        # 代码生成
        code: code-generator
        代码: code-generator
        python: code-generator
        java: code-generator
        go: code-generator
        golang: code-generator
        rust: code-generator
        javascript: code-generator
        js: code-generator
        typescript: code-generator
        ts: code-generator
        cpp: code-generator
        c++: code-generator
        程序: code-generator
        函数: code-generator
        脚本: code-generator
        算法: code-generator
        实现: code-generator
        编写: code-generator
        leetcode: code-generator
        # 翻译
        translate: translate-gen
        translation: translate-gen
        翻译: translate-gen
        # 摘要
        summary: summary-gen
        摘要: summary-gen
        总结: summary-gen

- id: code-generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 代码生成
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - classifier
  route_config:
    router_node_id: classifier
    route_value: code-generator
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |
      你是资深软件工程师。请直接给出可运行、可维护的代码方案，并附简要说明。
    template_vars:
      backend: system.default_backend
      model: system.default_model

- id: translate-gen
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 翻译生成
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - classifier
  route_config:
    router_node_id: classifier
    route_value: translate-gen
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |
      你是专业翻译。请准确、自然地翻译用户内容；未指定目标语言时，中英互译。
    template_vars:
      backend: system.default_backend
      model: system.default_model

- id: summary-gen
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 摘要生成
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - classifier
  route_config:
    router_node_id: classifier
    route_value: summary-gen
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |
      你是摘要助手。请提炼要点，使用简洁条目输出，保留关键事实与结论。
    template_vars:
      backend: system.default_backend
      model: system.default_model

- id: chat-generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: 通用对话
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  timeout: 120
  depends_on:
  - classifier
  route_config:
    router_node_id: classifier
    route_value: chat-generator
    is_default: true
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    prompt_template: '{{input}}'
    system_prompt: |
      你是一个可靠助手，请直接、准确地回答用户的问题。
    template_vars:
      backend: system.default_backend
      model: system.default_model

global_config:
  timeout: 180
  max_retries: 2
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
metadata:
  aligned_proxy_mode: router-mode
  lastUpdated: '2026-07-17T00:00:00.000Z'
  layoutVersion: '1.2'
  # 迁移期双写：capability_slots（优先）+ route_model_targets（兼容）
  capability_slots:
    - slot_id: router.code
      node_id: code-generator
      label: 代码生成
      kind: route
      tags: [code]
      hint: 建议绑定强代码能力模型
    - slot_id: router.translate
      node_id: translate-gen
      label: 翻译
      kind: route
      tags: [multilingual]
      hint: 建议绑定通用/多语言模型
    - slot_id: router.summary
      node_id: summary-gen
      label: 摘要
      kind: route
      tags: [cheap]
      hint: 可用更便宜或长上下文模型
    - slot_id: router.chat
      node_id: chat-generator
      label: 通用对话
      kind: route
      tags: [default]
      hint: 日常对话；默认可跟随系统默认
      default_follow_system: true
  route_model_targets:
    - node_id: code-generator
      label: 代码生成
      hint: 建议绑定强代码能力模型
    - node_id: translate-gen
      label: 翻译
      hint: 建议绑定通用/多语言模型
    - node_id: summary-gen
      label: 摘要
      hint: 可用更便宜或长上下文模型
    - node_id: chat-generator
      label: 通用对话
      hint: 日常对话；默认可跟随系统默认
      default_follow_system: true
