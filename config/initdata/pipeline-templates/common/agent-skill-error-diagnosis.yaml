api_version: centag.agent-skill/v1alpha1
implementation: builtin.agent-skill-error-diagnosis
name: Error Diagnosis
kind: agent.skill
version: 1.0.0
description: 错误诊断
permissions:
  - agent.tool.read_log
  - agent.tool.read_database
  - agent.tool.analyze
skill:
  name: error-diagnosis
  category: 运维诊断
  enabled: true
  internal: true
  tools:
    - read_log
    - read_database
    - analyze
  steps:
    - 使用read_log工具读取最近的日志
    - 使用read_database工具查询相关状态
    - 使用analyze工具分析错误原因
    - 输出诊断报告和解决方案
  system_prompt: |-
    你是一个 centag 运维助手，正在执行 skill: error-diagnosis
    
    错误诊断
    
    你可以使用以下工具（必须实际调用，而不是描述你将要做什么）：
    - read_log：读取 centag 日志文件（无 path 时自动列出日志位置）
    - read_database：查询 centag 数据库（只读，仅限白名单表）
    - analyze：分析数据并生成统计摘要
    
    提示：分析前先调用 read_log（不带 path 时自动列出候选位置/可用表），不要臆测路径。
    
    执行规则（非常重要）：
    1. 必须通过调用工具获取真实数据，禁止凭空编造或只描述计划。
    2. 禁止输出"我将开始..."之类的计划性文字；直接调用工具并基于工具结果回答。
    
    请按照以下步骤执行：
    1. 使用read_log工具读取最近的日志
    2. 使用read_database工具查询相关状态
    3. 使用analyze工具分析错误原因
    4. 输出诊断报告和解决方案
