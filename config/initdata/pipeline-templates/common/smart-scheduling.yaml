version: '1.0'
nodes:
- id: scheduler
  type: scheduler
  kind: scheduling.decide
  implementation: builtin.scheduler
  name: Smart Scheduling
  timeout: 15
  config:
    custom_config:
      strategy: balance
      classify_backend: "{{system.classify_backend}}"
      classify_model: "{{system.classify_model}}"
      classify_prompt: ""
- id: generator
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Scheduled Generate
  backend: "{{system.default_backend}}"
  model: "{{system.default_model}}"
  config:
    backend: "{{system.default_backend}}"
    model: "{{system.default_model}}"
    template_vars:
      backend: "system.default_backend"
      model: "system.default_model"
  timeout: 120
  retry:
    max_attempts: 0
    backoff_strategy: exponential
    initial_delay: 1000
    max_delay: 30000
  next_nodes:
    - generator_fallback
  depends_on:
  - scheduler
- id: generator_fallback
  type: generator
  kind: llm.generate
  implementation: builtin.generator
  name: Scheduled Fallback Generate
  backend: "{{system.fallback_backend}}"
  model: "{{system.fallback_model}}"
  config:
    backend: "{{system.fallback_backend}}"
    model: "{{system.fallback_model}}"
    custom_config:
      is_fallback: true
    template_vars:
      backend: "system.fallback_backend"
      model: "system.fallback_model"
  timeout: 120
  retry:
    max_attempts: 0
    backoff_strategy: exponential
    initial_delay: 1000
    max_delay: 30000
  depends_on:
    - generator
schema_version: centag.pipeline/v1alpha1
id: smart-scheduling
name: Smart Scheduling
shortcut_code: '#s'
global_config:
  timeout: 180
  max_retries: 2
  bypass_on_error: true
  parallel_limit: 4
  log_level: info
  fallback_groups:
    - primary_node_id: generator
      fallback_nodes:
        - generator_fallback
      max_attempts: 2
description: "Smart scheduling: builtin.scheduler classifies intent and scores backends/models, then generates; contrasts with transparent mode (follow client model) and direct mode (inject prompt + fixed backend/model)"
metadata:
  aligned_proxy_mode: smart-scheduling
  lastUpdated: '2026-07-21T00:00:00.000Z'
  layoutVersion: '1.2'
