services:
  centag:
    image: centag-personal:latest
    ports:
      - "20060:20060"
    environment:
      - LLM_PROXY_DB_DRIVER=sqlite
      - LLM_PROXY_DB_PATH=/app/storage/centag.db
      - SQLITE_PATH=/app/storage/centag.db
      - LLM_PROXY_ADMIN_USERNAME=admin
      - LLM_PROXY_ADMIN_PASSWORD=centag123
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=20060
      - LLM_PROXY_LOG_PATH=/app/logs
    volumes:
      - centag_storage:/app/storage
      - centag_logs:/app/logs

volumes:
  centag_storage:
  centag_logs:
