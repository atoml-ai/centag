# ============================================================
# Centag - 生产/Drone 部署（预构建统一镜像）
# ============================================================
# 使用方式：
#   cd deploy/docker
#   set -a && source ../../config/secrets/.env && set +a
#   HOST_IP=192.168.1.5 docker compose -f docker-compose.prod.yaml up -d
#
# 所有密钥通过环境变量或 ../../config/secrets/.env 注入。
# 中间件（PG/Redis/ES 等）由 deploy/stack 单独编排，此处仅通过 extra_hosts 解析域名。
# ============================================================

name: centag-prod

services:
  centag:
    image: ${CENTAG_IMAGE:-centag-personal:latest}
    pull_policy: if_not_present
    container_name: centag
    restart: unless-stopped
    env_file:
      - ../../config/secrets/.env
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
      - "${LLM_PROXY_SYSTEM_PROXY_PORT:-8081}:8081"
    networks:
      - centag-network
    volumes:
      - centag_storage:/app/storage
      - centag_logs:/app/logs
      - ../../config/initdata:/app/config/initdata:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    extra_hosts:
      - "pg.atoml.net:${HOST_IP:-host-gateway}"
      - "es.atoml.net:${HOST_IP:-host-gateway}"
      - "redis.atoml.net:${HOST_IP:-host-gateway}"
      - "chromadb.atoml.net:${HOST_IP:-host-gateway}"
      - "ollama.atoml.net:${HOST_IP:-host-gateway}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  centag_storage:
    driver: local
  centag_logs:
    driver: local

networks:
  centag-network:
    driver: bridge
    name: centag-network
