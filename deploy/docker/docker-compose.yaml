name: centag
# 仅编排 Centag 应用容器。运行时配置一律来自 ../../config/secrets/.env（与 ./start.sh docker … 一致）。
# 中间件由 deploy/stack：参见根目录 AGENTS.md。
#
#   cd deploy/docker && docker compose --env-file ../../config/secrets/.env up -d --build

services:
  centag:
    image: centag-${CENTAG_EDITION:-personal}:latest
    container_name: centag
    restart: unless-stopped
    env_file:
      - ../../config/secrets/.env
    ports:
      - "${LLM_PROXY_SERVER_PORT:-20060}:20060"
      - "${LLM_PROXY_SYSTEM_PROXY_PORT:-8081}:8081"
    networks:
      - centag-network
    volumes:
      - centag-storage:/app/storage
      - centag-logs:/app/logs
      - centag-plugins:/app/plugins
      - centag-certs:/app/bin/certs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  centag-storage:
  centag-logs:
  centag-plugins:
  centag-certs:

networks:
  centag-network:
    driver: bridge
    name: centag-network
