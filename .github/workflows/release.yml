name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.7). Empty = tag or package.json'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Version-branch gate: workflow_dispatch / tags must match vX | feature/vX | release/vX.
  guard-branch:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' apps/wrap-npm/package.json | head -1)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version v$V"

      - name: Require version branch
        run: bash scripts/release/require-release-branch.sh --ci --version "${{ steps.ver.outputs.version }}"

  # GitHub: full-matrix CLI (cross-compile on ubuntu).
  github-cli:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build CLI (all platforms)
        run: |
          bash scripts/release/build-artifacts.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --components personal \
            --platforms darwin-amd64,darwin-arm64,linux-amd64,linux-arm64,windows-amd64,windows-arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: github-cli-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: macOS tray desktop (native CGO; optional via install.sh --desktop).
  github-macos-desktop:
    needs: [guard-branch]
    runs-on: macos-14
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build macOS desktop (tray)
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: github-macos-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: Windows tray desktop (native CGO; optional via install.sh --desktop).
  github-windows-desktop:
    needs: [guard-branch]
    runs-on: windows-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install zip
        shell: bash
        run: choco install zip -y || true

      - name: Build Windows desktop (tray)
        shell: bash
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: github-windows-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  publish:
    needs: [guard-branch, github-cli, github-macos-desktop, github-windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          echo "version=${{ needs.guard-branch.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-staging

      - name: Flatten assets
        id: assets
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="release-assets/${V}"
          mkdir -p "$OUT"
          find release-staging -type f \( \
            -name 'centag-cli-*.tar.gz' -o \
            -name 'centag-desktop-*.dmg' -o \
            -name 'centag-desktop-*.zip' -o \
            -name 'centag-personal-*.tar.gz' -o \
            -name 'Centag-*.dmg' -o \
            -name 'Centag-*.zip' \
          \) -exec cp -f {} "$OUT/" \;
          : > "$OUT/checksums.txt"
          (
            cd "$OUT"
            for f in centag-cli-*.tar.gz centag-desktop-*.dmg centag-desktop-*.zip \
                     centag-personal-*.tar.gz Centag-*.dmg Centag-*.zip; do
              [[ -f "$f" ]] || continue
              printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f" >> checksums.txt
            done
          )
          ls -lh "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}"
          OUT="${{ steps.assets.outputs.dir }}"
          DRAFT_FLAG="--draft"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            DRAFT_FLAG="--draft"
          elif [[ "${{ inputs.draft }}" == "false" ]]; then
            DRAFT_FLAG=""
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## Centag ${TAG}"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "# GitHub / install.sh — CLI on all platforms (default)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s ${V} && . \"\$HOME/.centag/env\""
            echo ""
            echo "# Win/mac tray desktop (optional)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s -- --desktop ${V}"
            echo ""
            echo "# npm — CLI on all platforms"
            echo "npm install -g centag"
            echo '```'
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`centag-cli-personal-<goos>-<goarch>.tar.gz\` — CLI (install.sh default)"
            echo "- \`centag-desktop-personal-macos-<arch>.dmg\` / \`.zip\` — macOS desktop"
            echo "- \`centag-desktop-personal-windows-<arch>.zip\` — Windows desktop"
            echo "- \`checksums.txt\` — SHA-256 sums"
          } > "$NOTES_FILE"

          UPLOAD=( )
          while IFS= read -r f; do
            UPLOAD+=("$f")
          done < <(find "$OUT" -maxdepth 1 -type f \( \
            -name 'centag-cli-*.tar.gz' -o \
            -name 'centag-desktop-*.dmg' -o \
            -name 'centag-desktop-*.zip' -o \
            -name 'checksums.txt' \
          \) | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${UPLOAD[@]}" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $DRAFT_FLAG \
              --title "Centag ${V}" \
              --notes-file "$NOTES_FILE" \
              "${UPLOAD[@]}"
          fi

  # npm channel: unchanged — CLI for all platforms (separate from GitHub desktop).
  npm-publish:
    needs: [guard-branch, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Build & pack npm packages
        run: |
          DRY_RUN=1 bash scripts/publish-centag-npm.sh

      - name: Publish to npm
        if: "!github.event.inputs.draft"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CENTAG_NPM_TOKEN }}
        run: |
          NPM_DIR="apps/centag-npm"
          VENDOR_DIR="${NPM_DIR}/bin/vendor"
          mkdir -p "${VENDOR_DIR}"

          # Cross-compile CLI binaries for all platforms (npm channel)
          PLATFORMS="darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64"
          TAGS="protocol_openai,protocol_anthropic,protocol_gemini,protocol_openairesponses,backend_openai,backend_ollama,backend_anthropic,backend_gemini,backend_azure"
          VERSION="${{ needs.guard-branch.outputs.version }}"

          for p in $PLATFORMS; do
            goos="${p%-*}"; goarch="${p##*-}"
            ext=""; [[ "$goos" == "windows" ]] && ext=".exe"
            out="${VENDOR_DIR}/${p}/centag-personal${ext}"
            mkdir -p "$(dirname "$out")"
            echo "==> build centag-personal ${p}"
            (
              cd dist/personal
              GOWORK=off CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
                go build -trimpath -tags "$TAGS" -ldflags="-s -w" -o "$(realpath "$out")" .
            )
          done

          for p in $PLATFORMS; do
            dest="${VENDOR_DIR}/${p}/config"
            mkdir -p "${dest}"
            if [[ -d config/initdata ]]; then
              rm -rf "${dest}/initdata"
              cp -R config/initdata "${dest}/initdata"
              rm -rf "${dest}/initdata/postgresql" "${dest}/initdata/scripts" \
                "${dest}/initdata/update" "${dest}/initdata/secrets" 2>/dev/null || true
              find "${dest}/initdata" \( -name 'README.md' -o -name 'AGENTS.md' \) -delete 2>/dev/null || true
              rm -rf "${dest}/initdata/pipeline-templates/personal" "${dest}/initdata/pipeline-templates/team"
            fi
            if [[ -d config/profiles/personal/initdata ]]; then
              mkdir -p "${dest}/profiles/personal"
              rm -rf "${dest}/profiles/personal/initdata"
              cp -R config/profiles/personal/initdata "${dest}/profiles/personal/initdata"
            fi
          done

          STATIC_DIR="${NPM_DIR}/static"
          mkdir -p "${STATIC_DIR}"
          ( cd web && npm ci && CENTAG_INSTALL_ROOT="$PWD/.." CENTAG_EDITION=personal CENTAG_STATIC_DIR="$(realpath "${STATIC_DIR}")" npm run build )

          : > "${VENDOR_DIR}/checksums.txt"
          for p in $PLATFORMS; do
            goos="${p%-*}"; goarch="${p##*-}"
            ext=""; [[ "$goos" == "windows" ]] && ext=".exe"
            f="${VENDOR_DIR}/${p}/centag-personal${ext}"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s  %s/centag-personal%s\n' "$sha" "$p" "$ext" >> "${VENDOR_DIR}/checksums.txt"
          done

          echo "==> npm publish centag"
          ( cd "${NPM_DIR}" && npm publish --access public )

          echo "==> npm publish centag-offline"
          OFFLINE_STAGE="$(mktemp -d)"
          cp -R "${NPM_DIR}/bin" "${OFFLINE_STAGE}/bin"
          cp -R "${NPM_DIR}/lib" "${OFFLINE_STAGE}/lib"
          cp -R "${NPM_DIR}/static" "${OFFLINE_STAGE}/static"
          cp "${NPM_DIR}/README.md" "${OFFLINE_STAGE}/README.md"
          cp "${NPM_DIR}/package.offline.json" "${OFFLINE_STAGE}/package.json"
          ( cd "${OFFLINE_STAGE}" && npm publish --access public )
          rm -rf "${OFFLINE_STAGE}"
