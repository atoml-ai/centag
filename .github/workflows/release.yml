name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.7). Empty = tag or package.json'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Version-branch gate: workflow_dispatch / tags must match vX | feature/vX | release/vX.
  guard-branch:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' apps/wrap-npm/package.json | head -1)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version v$V"

      - name: Require version branch
        run: bash scripts/release/require-release-branch.sh --ci --version "${{ steps.ver.outputs.version }}"

  # Default release set: personal CLI + wrap (cross-compile, no CGO).
  binaries:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build personal + wrap
        run: |
          bash scripts/release/build-artifacts.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --components personal,wrap

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: centag-binaries-${{ needs.guard-branch.outputs.version }}
          path: bin/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  publish:
    needs: [guard-branch, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          echo "version=${{ needs.guard-branch.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging

      - name: Flatten assets
        id: assets
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="bin/release/${V}"
          mkdir -p "$OUT"
          find release-staging -type f \( -name 'centag-*.tar.gz' -o -name 'checksums.txt' \) -exec cp -f {} "$OUT/" \;
          : > "$OUT/checksums.txt"
          (
            cd "$OUT"
            for f in centag-*.tar.gz; do
              [[ -f "$f" ]] || continue
              printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f" >> checksums.txt
            done
          )
          ls -lh "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}"
          OUT="${{ steps.assets.outputs.dir }}"
          DRAFT_FLAG="--draft"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            DRAFT_FLAG="--draft"
          elif [[ "${{ inputs.draft }}" == "false" ]]; then
            DRAFT_FLAG=""
          fi

          # Keep all lines indented under `run: |` — unindented heredoc breaks YAML parsing.
          NOTES_FILE="$(mktemp)"
          {
            echo "## Centag ${TAG}"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "# pin version (recommended — no GitHub API lookup)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s ${V} && . \"\$HOME/.centag/env\""
            echo ""
            echo "# personal only / wrap only"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s personal ${V} && . \"\$HOME/.centag/env\""
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s wrap ${V} && . \"\$HOME/.centag/env\""
            echo '```'
            echo ""
            echo "Default install root: \`~/.centag\`. Chain \`. ~/.centag/env\` so PATH applies in this shell."
            echo "\`minimal\` / \`launcher\` are not published in this release."
            echo ""
            echo "### Uninstall"
            echo ""
            echo "No dedicated uninstall command yet — remove manually:"
            echo ""
            echo '```bash'
            echo 'centag-wrap disable 2>/dev/null || true'
            echo "pkill -f 'centag-personal|/\\.centag/bin/centag' 2>/dev/null || true"
            echo 'rm -rf "${HOME}/.centag"'
            echo '# Also remove PATH line from ~/.zshrc / ~/.bashrc if present:'
            echo '#   export PATH="$HOME/.centag/bin:$PATH"'
            echo '```'
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`centag-personal-<goos>-<goarch>.tar.gz\` — personal CLI + WebUI static"
            echo "- \`centag-wrap-<goos>-<goarch>.tar.gz\` — third-party CLI launcher / process helper"
            echo "- \`checksums.txt\` — SHA-256 sums"
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT"/centag-*.tar.gz "$OUT"/checksums.txt --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $DRAFT_FLAG \
              --title "Centag ${V}" \
              --notes-file "$NOTES_FILE" \
              "$OUT"/centag-*.tar.gz "$OUT"/checksums.txt
          fi
