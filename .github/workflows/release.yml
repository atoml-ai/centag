name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.7). Empty = tag or package.json'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Version-branch gate: workflow_dispatch / tags must match vX | feature/vX | release/vX.
  guard-branch:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' apps/wrap-npm/package.json | head -1)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version v$V"

      - name: Require version branch
        run: bash scripts/release/require-release-branch.sh --ci --version "${{ steps.ver.outputs.version }}"

  # GitHub: linux CLI (cross-compile on ubuntu). Win/mac CLI stays npm-only.
  github-cli:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build CLI (linux)
        run: |
          bash scripts/release/build-artifacts.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --components personal \
            --platforms linux-amd64,linux-arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-cli-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: macOS desktop (native CGO per-arch; HOST_GOARCH comes from the runner).
  github-macos-desktop:
    needs: [guard-branch]
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build macOS desktop (${{ matrix.arch }})
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-macos-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: Windows desktop (amd64 native; arm64 cross-compile, no CGO in the launcher).
  github-windows-desktop:
    needs: [guard-branch]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install zip
        shell: bash
        run: choco install zip -y || true

      - name: Build Windows desktop (${{ matrix.arch }})
        shell: bash
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-windows-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: fnOS install packages (native, per-arch; falls back to manual packing on CI).
  github-fnos:
    needs: [guard-branch]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build fnOS package (${{ matrix.arch }})
        run: |
          bash deploy/fnos/build-fpk.sh \
            --mode native \
            --edition personal \
            --arch ${{ matrix.arch }} \
            --output "${{ github.workspace }}/fnos-out"

      - name: Upload fnOS package
        uses: actions/upload-artifact@v7
        with:
          name: github-fnos-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: ${{ github.workspace }}/fnos-out/
          if-no-files-found: error

  # GitHub: OTA update packages (linux amd64/arm64; explicit release version).
  github-ota:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build OTA packages
        run: |
          bash scripts/release/build-ota.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --platforms linux-amd64,linux-arm64

      - name: Upload OTA packages
        uses: actions/upload-artifact@v7
        with:
          name: github-ota-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/packages/
          if-no-files-found: error

  publish:
    needs: [guard-branch, github-cli, github-macos-desktop, github-windows-desktop, github-fnos, github-ota]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          echo "version=${{ needs.guard-branch.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-staging

      - name: Flatten assets
        id: assets
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="release-assets/${V}"
          mkdir -p "$OUT"
          find release-staging -type f \( \
            -name 'centag-cli-*.tar.gz' -o \
            -name 'centag-desktop-*.dmg' -o \
            -name 'centag-desktop-*.zip' -o \
            -name 'centag-personal-*.tar.gz' -o \
            -name 'centag-*-native-*.fpk' -o \
            -name 'update-package-*.tar.gz' -o \
            -name 'Centag-*.dmg' -o \
            -name 'Centag-*.zip' \
          \) -exec cp -f {} "$OUT/" \;
          : > "$OUT/checksums.txt"
          (
            cd "$OUT"
            for f in centag-cli-*.tar.gz centag-desktop-*.dmg centag-desktop-*.zip \
                     centag-personal-*.tar.gz centag-*-native-*.fpk update-package-*.tar.gz \
                     Centag-*.dmg Centag-*.zip; do
              [[ -f "$f" ]] || continue
              printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f" >> checksums.txt
            done
          )
          ls -lh "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}"
          OUT="${{ steps.assets.outputs.dir }}"
          DRAFT_FLAG="--draft"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            DRAFT_FLAG="--draft"
          elif [[ "${{ inputs.draft }}" == "false" ]]; then
            DRAFT_FLAG=""
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## Centag ${TAG}"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "# Linux — CLI (default)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s ${V} && . \"\$HOME/.centag/env\""
            echo ""
            echo "# macOS / Windows — desktop (default on these OS; no CLI on GitHub channel)"
            echo "curl -fsSL https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install.sh | bash -s ${V} && . \"\$HOME/.centag/env\""
            echo ""
            echo "# npm — CLI on all platforms"
            echo "npm install -g centag"
            echo '```'
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`centag-cli-personal-linux-<arch>.tar.gz\` — Linux CLI (install.sh default)"
            echo "- \`centag-desktop-personal-macos-<arch>.dmg\` / \`.zip\` — macOS desktop"
            echo "- \`centag-desktop-personal-windows-<arch>.zip\` — Windows desktop"
            echo "- \`centag-personal-native-<arch>.fpk\` — fnOS install package"
            echo "- \`update-package-centag-personal-<ver>-linux-<arch>.tar.gz\` — OTA update"
            echo "- \`checksums.txt\` — SHA-256 sums"
          } > "$NOTES_FILE"

          UPLOAD=( )
          while IFS= read -r f; do
            UPLOAD+=("$f")
          done < <(find "$OUT" -maxdepth 1 -type f \( \
            -name 'centag-cli-*.tar.gz' -o \
            -name 'centag-desktop-*.dmg' -o \
            -name 'centag-desktop-*.zip' -o \
            -name 'centag-*-native-*.fpk' -o \
            -name 'update-package-*.tar.gz' -o \
            -name 'checksums.txt' \
          \) | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${UPLOAD[@]}" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $DRAFT_FLAG \
              --title "Centag ${V}" \
              --notes-file "$NOTES_FILE" \
              "${UPLOAD[@]}"
          fi

          # Drop obsolete proxyctl assets left from older uploads (--clobber only replaces same names).
          bash "${GITHUB_WORKSPACE}/scripts/release/delete-legacy-release-assets.sh" --tag "$TAG" --repo "$REPO"

  # npm channel: unchanged — CLI for all platforms (separate from GitHub desktop).
  npm-publish:
    needs: [guard-branch, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Sync npm package versions
        run: bash scripts/release/sync-npm-version.sh --version "${{ needs.guard-branch.outputs.version }}"

      - name: Build & publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CENTAG_NPM_TOKEN }}
          CENTAG_NPM_TOKEN: ${{ secrets.CENTAG_NPM_TOKEN }}
        run: |
          # draft=true → pack only; otherwise publish (tag push has no draft input → publish)
          if [[ "${{ github.event.inputs.draft }}" == "true" ]]; then
            DRY_RUN=1 bash scripts/publish-centag-npm.sh
          else
            bash scripts/publish-centag-npm.sh
          fi
