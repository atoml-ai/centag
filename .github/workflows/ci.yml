name: ci

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # Pinned edgeag revision — bump deliberately (update the same constant in
      # centag-pro release.yml). Never track a moving branch: builds must be
      # reproducible against a fixed commit.
      EDGEAG_REF: "7f1e4e9385362cfa58500778a83bc95f8fa23f8a"
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: No private deps (E4 / R01)
        run: bash scripts/ci-check-no-private-deps.sh
      - name: Test selected packages
        run: |
          mapfile -t pkgs < <(bash scripts/ci-go-packages.sh | head -n 80)
          go test "${pkgs[@]}"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:ui-caps
      - name: Build personal/minimal host (no team pack)
        run: npm run build
