name: release-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.2.7). Empty = tag or package.json'
        required: false
        default: ''

permissions:
  contents: read

# Pinned edgeag revision — keep in sync with ci.yml and other release-*.yml.
# core/go.mod replaces edgeag => ../../edgeag and go.work uses ../edgeag, so
# EVERY job that runs `go build` needs the sibling checkout (P1-7).
env:
  EDGEAG_REF: "7f1e4e9385362cfa58500778a83bc95f8fa23f8a"

jobs:
  # Version-branch gate: workflow_dispatch / tags must match vX | feature/vX | release/vX.
  # Bypassed for build: build is non-publishing, the gate re-runs in release-github / release-npm.
  guard-branch:
    runs-on: ubuntu-latest
    env:
      CENTAG_RELEASE_ALLOW_ANY_BRANCH: '1'
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' apps/wrap-npm/package.json | head -1)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version v$V"

      - name: Require version branch
        run: bash scripts/release/require-release-branch.sh --ci --version "${{ steps.ver.outputs.version }}"

  # GitHub: linux CLI (cross-compile on ubuntu). Win/mac CLI stays npm-only.
  github-cli:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build CLI (linux)
        run: |
          bash scripts/release/build-artifacts.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --components personal \
            --platforms linux-amd64,linux-arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-cli-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: macOS desktop (native CGO per-arch; HOST_GOARCH comes from the runner).
  github-macos-desktop:
    needs: [guard-branch]
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build macOS desktop (${{ matrix.arch }})
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-macos-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: Windows desktop (amd64 native; arm64 cross-compile, no CGO in the launcher).
  github-windows-desktop:
    needs: [guard-branch]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
      GOPROXY: https://proxy.golang.org,direct
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      # Windows runner: git-bash `ln -s` copies the tree (no symlink support) —
      # functionally equivalent for the go.work sibling resolution.
      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install zip
        shell: bash
        run: choco install zip -y || true

      - name: Build Windows desktop (${{ matrix.arch }})
        shell: bash
        run: |
          bash scripts/release/package-desktop.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --edition personal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: github-windows-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/release/${{ needs.guard-branch.outputs.version }}/
          if-no-files-found: error

  # GitHub: fnOS install packages (native, per-arch; falls back to manual packing on CI).
  github-fnos:
    needs: [guard-branch]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build fnOS package (${{ matrix.arch }})
        run: |
          bash deploy/fnos/build-fpk.sh \
            --mode native \
            --edition personal \
            --arch ${{ matrix.arch }} \
            --output "${{ github.workspace }}/fnos-out"

      - name: Upload fnOS package
        uses: actions/upload-artifact@v7
        with:
          name: github-fnos-${{ matrix.arch }}-${{ needs.guard-branch.outputs.version }}
          path: ${{ github.workspace }}/fnos-out/
          if-no-files-found: error

  # GitHub: OTA update packages (linux amd64/arm64; explicit release version).
  github-ota:
    needs: [guard-branch]
    runs-on: ubuntu-latest
    env:
      CENTAG_INSTALL_ROOT: ${{ github.workspace }}/.centag
    steps:
      - uses: actions/checkout@v6

      - name: Checkout edgeag (go.work sibling module)
        uses: actions/checkout@v6
        with:
          repository: atoml-ai/edgeag
          path: edgeag
          ref: ${{ env.EDGEAG_REF }}

      - name: Link edgeag as sibling for go.work
        run: |
          ln -sfn "${{ github.workspace }}/edgeag" "${{ github.workspace }}/../edgeag"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build OTA packages
        run: |
          bash scripts/release/build-ota.sh \
            --version "${{ needs.guard-branch.outputs.version }}" \
            --platforms linux-amd64,linux-arm64

      - name: Upload OTA packages
        uses: actions/upload-artifact@v7
        with:
          name: github-ota-${{ needs.guard-branch.outputs.version }}
          path: .centag/var/packages/
          if-no-files-found: error
